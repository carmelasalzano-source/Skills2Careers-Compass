[build]
  # Explicitly tell Netlify this is a static site with no build step
  command = "" 
  publish = "."

[[headers]]
  # Default security headers for all paths
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  # Prevent caching of the root URL so updates are seen immediately
  for = "/"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  # Prevent caching of the main HTML file so updates are seen immediately
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  # Long-cache vendor assets (versioned via filename — safe to cache indefinitely)
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # JSON data: always revalidate so deploys are seen immediately
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  # JS and CSS app files: never cache so deploys are always seen immediately
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-store"