<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#007DBA"/>
      <stop offset="60%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle glow -->
  <circle cx="1050" cy="120" r="320" fill="#007DBA" fill-opacity="0.07"/>
  <circle cx="100"  cy="520" r="220" fill="#4F46E5" fill-opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- UNESCO blue left stripe -->
  <rect x="0" y="5" width="5" height="625" fill="#007DBA" fill-opacity="0.6"/>

  <!-- UNESCO INITIATIVE label -->
  <text
    x="80" y="118"
    font-family="'Inter', Arial, sans-serif"
    font-size="16" font-weight="500"
    fill="#7dd3fc" letter-spacing="3">A UNESCO INITIATIVE</text>

  <!-- Main title -->
  <text
    x="80" y="218"
    font-family="'Inter', Arial, sans-serif"
    font-size="82" font-weight="800"
    fill="white" letter-spacing="-3">Skills2Careers</text>
  <text
    x="80" y="298"
    font-family="'Inter', Arial, sans-serif"
    font-size="82" font-weight="800"
    fill="#007DBA" letter-spacing="-3">Compass</text>

  <!-- Tagline -->
  <text
    x="80" y="360"
    font-family="'Inter', Arial, sans-serif"
    font-size="26" font-weight="400"
    fill="#94a3b8">Navigate your career in East Africa's green and digital economy</text>

  <!-- Divider -->
  <rect x="80" y="400" width="1040" height="1" fill="white" fill-opacity="0.08"/>

  <!-- Sector pills -->
  <rect x="80"  y="422" width="160" height="36" rx="18" fill="#4FB293" fill-opacity="0.18"/>
  <text x="160" y="445" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="600" fill="#4FB293" text-anchor="middle">Agritech</text>

  <rect x="256" y="422" width="220" height="36" rx="18" fill="#E4A429" fill-opacity="0.18"/>
  <text x="366" y="445" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="600" fill="#E4A429" text-anchor="middle">Renewable Energy</text>

  <rect x="492" y="422" width="190" height="36" rx="18" fill="#007DBA" fill-opacity="0.22"/>
  <text x="587" y="445" font-family="'Inter', Arial, sans-serif" font-size="15" font-weight="600" fill="#7dd3fc" text-anchor="middle">Digital Economy</text>

  <!-- Stats row -->
  <text x="80"  y="530" font-family="'Inter', Arial, sans-serif" font-size="48" font-weight="800" fill="white">43</text>
  <text x="80"  y="558" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" letter-spacing="1.5">MAPPED ROLES</text>
  <rect x="230" y="490" width="1" height="72" fill="white" fill-opacity="0.10"/>

  <text x="250" y="530" font-family="'Inter', Arial, sans-serif" font-size="48" font-weight="800" fill="white">91</text>
  <text x="250" y="558" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" letter-spacing="1.5">SKILLS TRACKED</text>
  <rect x="415" y="490" width="1" height="72" fill="white" fill-opacity="0.10"/>

  <text x="435" y="530" font-family="'Inter', Arial, sans-serif" font-size="48" font-weight="800" fill="white">199</text>
  <text x="435" y="558" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" letter-spacing="1.5">LEARNING PATHWAYS</text>
  <rect x="648" y="490" width="1" height="72" fill="white" fill-opacity="0.10"/>

  <text x="668" y="530" font-family="'Inter', Arial, sans-serif" font-size="48" font-weight="800" fill="white">8</text>
  <text x="668" y="558" font-family="'Inter', Arial, sans-serif" font-size="13" font-weight="500" fill="#475569" letter-spacing="1.5">EAC COUNTRIES</text>

  <!-- URL bottom-right -->
  <text
    x="1120" y="558"
    font-family="'Inter', Arial, sans-serif"
    font-size="15" font-weight="400"
    fill="#334155" text-anchor="end">skills2careers.netlify.app</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" opacity="0.5"/>
</svg>
